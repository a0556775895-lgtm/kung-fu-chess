[run]
data_file = DOCS/tests/reports/.coverage
omit =
    DOCS/tests/*
    client/view/*
    client/main.py
    server/main.py
    client/input/commands.py
    client/input/mouse_command_extractor.py

[report]
fail_under = 100
exclude_lines =
    pragma: no cover
    class \w+\(Protocol\):
show_missing = True
